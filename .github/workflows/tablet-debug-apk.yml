name: Tablet phase 1 debug APK

on:
  push:
    branches: ['dev/tablet-playback-phase1']

permissions:
  contents: read

concurrency:
  group: tablet-debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    if: github.ref == 'refs/heads/dev/tablet-playback-phase1'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the development commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install the verified Android SDK tools
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="$RUNNER_TEMP/frame-android-sdk"
          tools_zip="$RUNNER_TEMP/frame-commandlinetools.zip"
          curl -fsSL --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip -o "$tools_zip"
          printf '%s  %s\n' e025545c62a8e64c7559119566a569fb1dec5f60 "$tools_zip" | sha1sum -c -
          mkdir -p "$sdk_root/cmdline-tools"
          staging_dir=$(mktemp -d)
          unzip -q "$tools_zip" -d "$staging_dir"
          mv "$staging_dir/cmdline-tools" "$sdk_root/cmdline-tools/latest"
          rmdir "$staging_dir"
          export ANDROID_HOME="$sdk_root"
          export ANDROID_SDK_ROOT="$sdk_root"
          manager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          "$manager" --sdk_root="$sdk_root" --licenses < <(yes) > "$RUNNER_TEMP/frame-sdk-licenses.log" 2>&1
          "$manager" --sdk_root="$sdk_root" 'platforms;android-36' 'build-tools;35.0.0'
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"

      - name: Build the debug APK
        run: ./gradlew assembleDebug --no-daemon --max-workers=2 --stacktrace

      - name: Verify and package the APK
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          mkdir -p artifact
          cp "$apk" artifact/Frame-phase1-debug.apk
          cd artifact
          sha256sum Frame-phase1-debug.apk > Frame-phase1-debug.apk.sha256

      - name: Upload the downloadable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Frame-phase1-debug
          path: artifact/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
