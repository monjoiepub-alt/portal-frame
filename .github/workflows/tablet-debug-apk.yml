name: Tablet phase 1 debug APK

on:
  push:
    branches: ['dev/tablet-playback-phase1']

permissions:
  contents: read

concurrency:
  group: tablet-debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    if: github.ref == 'refs/heads/dev/tablet-playback-phase1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the development commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install the pinned Android SDK components
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Build the debug APK
        run: ./gradlew assembleDebug --no-daemon --max-workers=2 --stacktrace

      - name: Verify and package the APK
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          mkdir -p artifact
          cp "$apk" artifact/Frame-phase1-debug.apk
          cd artifact
          sha256sum Frame-phase1-debug.apk > Frame-phase1-debug.apk.sha256

      - name: Upload the downloadable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Frame-phase1-debug
          path: artifact/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
