name: CI

# Build the debug APK, run JVM unit tests, and run static analysis (Android Lint +
# detekt + ktlint) on every push and pull request, so a broken build, a failing test,
# or a new lint/style regression is caught before it lands. The signed release build
# lives in release.yml (tag pushes only) and needs no secrets here.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch: {}

# Cancel an in-progress run when newer commits land on the same ref (and avoid a
# duplicate run when a push and its pull_request would both fire).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install the verified Android SDK tools
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="$RUNNER_TEMP/frame-android-sdk"
          tools_zip="$RUNNER_TEMP/frame-commandlinetools.zip"
          curl -fsSL --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip -o "$tools_zip"
          printf '%s  %s\n' e025545c62a8e64c7559119566a569fb1dec5f60 "$tools_zip" | sha1sum -c -
          mkdir -p "$sdk_root/cmdline-tools"
          staging_dir=$(mktemp -d)
          unzip -q "$tools_zip" -d "$staging_dir"
          mv "$staging_dir/cmdline-tools" "$sdk_root/cmdline-tools/latest"
          rmdir "$staging_dir"
          export ANDROID_HOME="$sdk_root"
          export ANDROID_SDK_ROOT="$sdk_root"
          manager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          "$manager" --sdk_root="$sdk_root" --licenses < <(yes) > "$RUNNER_TEMP/frame-sdk-licenses.log" 2>&1
          "$manager" --sdk_root="$sdk_root" 'platforms;android-36' 'build-tools;35.0.0'
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"

      - name: Build debug APK + run unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug testDebugUnitTest --no-daemon --max-workers=2 --stacktrace

      - name: Static analysis (Android Lint, detekt, ktlint)
        run: ./gradlew lintDebug detekt ktlintCheck --no-daemon --max-workers=2 --stacktrace

      - name: Upload lint/analysis reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/detekt/
          if-no-files-found: ignore

      - name: Upload unit test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore
